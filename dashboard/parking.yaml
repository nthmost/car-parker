# Parking dashboard — drives the car_parker integration.
#
# Requires HACS custom:button-card.
#
# Deployed at /config/dashboards/parking.yaml on the HA host.
# Registered in /config/configuration.yaml under lovelace.dashboards.car-parker.

title: Parking

# ── Reusable button-card templates ─────────────────────────────────────────
button_card_templates:

  # A single candidate block (one of up to 5). Hidden if no candidate at idx.
  block_candidate:
    entity: sensor.car_parker_status
    show_icon: false
    show_state: false
    name: |
      [[[
        const c = entity.attributes?.candidates?.[variables.idx];
        if (!c) return '';
        return `
          <div style="display:flex;justify-content:space-between;align-items:baseline;width:100%;">
            <div>
              <div style="font-weight:bold;font-size:17px;">${c.street}</div>
              <div style="font-size:13px;opacity:0.7;margin-top:2px;">${c.limits}</div>
            </div>
            <div style="font-size:12px;opacity:0.6;white-space:nowrap;margin-left:12px;">${c.distance_m}m</div>
          </div>`;
      ]]]
    styles:
      card:
        - padding: 14px 18px
        - min-height: 0
        - height: auto
        - text-align: left
        - display: |
            [[[ return entity.attributes?.candidates?.[variables.idx] ? 'block' : 'none'; ]]]
      name:
        - text-align: left
        - margin: 0
        - padding: 0
        - width: 100%
    tap_action:
      action: call-service
      service: car_parker.pick_block
      service_data:
        street: |
          [[[ return entity.attributes?.candidates?.[variables.idx]?.street; ]]]
        limits: |
          [[[ return entity.attributes?.candidates?.[variables.idx]?.limits; ]]]

  # A single side button. Hidden if `variables.side` isn't in candidate_sides.
  side_button:
    entity: sensor.car_parker_status
    show_state: false
    name: |
      [[[ return variables.side; ]]]
    icon: |
      [[[
        const arrows = {North: 'mdi:arrow-up-bold', South: 'mdi:arrow-down-bold',
                        East: 'mdi:arrow-right-bold', West: 'mdi:arrow-left-bold'};
        return arrows[variables.side];
      ]]]
    styles:
      card:
        - padding: 16px
        - display: |
            [[[
              const sides = entity.attributes?.candidate_sides || [];
              return sides.includes(variables.side) ? 'block' : 'none';
            ]]]
      icon:
        - width: 48px
        - height: 48px
    tap_action:
      action: call-service
      service: car_parker.confirm_side
      service_data:
        side: |
          [[[ return variables.side; ]]]

  # Sweep countdown card — color-coded by urgency.
  sweep_card:
    entity: sensor.car_parker_urgency
    show_state: false
    show_icon: true
    icon: mdi:broom
    name: |
      [[[
        const label = states['sensor.next_street_sweep_label']?.state;
        const u = entity.state;
        if (u === 'now') return 'Move your car — sweeping now';
        if (!label || label === 'unknown' || label === 'unavailable') return 'No upcoming sweep';
        return label;
      ]]]
    styles:
      card:
        - padding: 18px 20px
        - text-align: left
        - background-color: |
            [[[
              const u = entity.state;
              if (u === 'now')    return 'rgba(200,0,0,0.12)';
              if (u === 'urgent') return 'rgba(220,80,0,0.10)';
              if (u === 'soon')   return 'rgba(200,150,0,0.08)';
              return 'rgba(40,160,80,0.07)';
            ]]]
        - border-left: |
            [[[
              const u = entity.state;
              if (u === 'now')    return '4px solid #cc0000';
              if (u === 'urgent') return '4px solid #dd5500';
              if (u === 'soon')   return '4px solid #c89600';
              return '4px solid #28a050';
            ]]]
      name:
        - font-size: 16px
        - font-weight: 600
        - white-space: normal
        - text-align: left
      icon:
        - color: |
            [[[
              const u = entity.state;
              if (u === 'now')    return '#cc0000';
              if (u === 'urgent') return '#dd5500';
              if (u === 'soon')   return '#c89600';
              return '#28a050';
            ]]]
        - width: 28px
        - height: 28px

  # Maps button — uses GPS coords if available, falls back to street search.
  maps_button:
    entity: sensor.car_parker_status
    show_state: false
    show_icon: true
    icon: mdi:map-marker
    name: Open in Maps
    tap_action:
      action: url
      url_path: |
        [[[
          const lat = entity.attributes?.lat;
          const lng = entity.attributes?.lng;
          const st = states['sensor.parked_location']?.attributes?.street || '';
          if (lat && lng) return `https://maps.apple.com/?q=${lat},${lng}`;
          return `https://maps.apple.com/?q=${encodeURIComponent(st + ', San Francisco, CA')}`;
        ]]]

# ── Views ──────────────────────────────────────────────────────────────────
views:
  - title: Parking
    path: parking
    icon: mdi:car
    type: sections
    max_columns: 1
    sections:

      # ── EMPTY state ────────────────────────────────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: empty
        cards:
          - type: button
            name: Park here
            icon: mdi:car-arrow-right
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: car_parker.park_here
              data:
                entity_id: person.YOUR_NAME  # replace with your person entity
          - type: button
            name: Park at car
            icon: mdi:car-connected
            icon_height: 80px
            tap_action:
              action: perform-action
              perform_action: car_parker.park_here
              data:
                entity_id: device_tracker.YOUR_CAR  # replace with your car's GPS device_tracker
          - type: markdown
            content: |
              Tap **Park here** to use your phone's GPS, **Park at car** to use
              the car's GPS, or enter your location manually below.

      # ── PENDING / pick_block ───────────────────────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: pending
          - condition: state
            entity: sensor.car_parker_status
            attribute: stage
            state: pick_block
        cards:
          - type: markdown
            content: |
              ### 📍 Which block are you on?
              GPS thinks you're near these — tap the one that matches.
              {% set tl = state_attr('sensor.car_parker_status', 'time_limit') %}
              {% if tl and tl.hrlimit %}
              **Nearby time limit:** {{ tl.hrlimit | int }}-hour{% if tl.from_time and tl.to_time %} {{ tl.from_time }}–{{ tl.to_time }}{% endif %}{% if tl.days %} ({{ tl.days }}){% endif %}
              {% endif %}
          - type: custom:button-card
            template: block_candidate
            variables: { idx: 0 }
          - type: custom:button-card
            template: block_candidate
            variables: { idx: 1 }
          - type: custom:button-card
            template: block_candidate
            variables: { idx: 2 }
          - type: custom:button-card
            template: block_candidate
            variables: { idx: 3 }
          - type: custom:button-card
            template: block_candidate
            variables: { idx: 4 }
          - type: button
            name: Cancel
            icon: mdi:close
            tap_action:
              action: call-service
              service: car_parker.clear

      # ── PENDING / pick_side ────────────────────────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: pending
          - condition: state
            entity: sensor.car_parker_status
            attribute: stage
            state: pick_side
        cards:
          - type: markdown
            content: |
              ### Which side of the street?
              {% set cb = state_attr('sensor.car_parker_status', 'chosen_block') %}
              {% if cb %}**{{ cb.street }}** — {{ cb.limits }}{% endif %}
          - type: custom:button-card
            template: side_button
            variables: { side: North }
          - type: custom:button-card
            template: side_button
            variables: { side: South }
          - type: custom:button-card
            template: side_button
            variables: { side: East }
          - type: custom:button-card
            template: side_button
            variables: { side: West }
          - type: button
            name: Cancel
            icon: mdi:close
            tap_action:
              action: call-service
              service: car_parker.clear

      # ── PARKED: urgent alert (only when move_car_now is on) ────────────
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.move_car_now
            state: 'on'
        cards:
          - type: markdown
            content: |
              <p style="text-align:center;font-size:22px;font-weight:700;color:#cc0000;margin:8px 0">
              🚨 Move your car now 🚨
              </p>
              <p style="text-align:center;opacity:0.8;margin:0">
              Street sweeping is happening or starts very soon.
              </p>

      # ── PARKED: location + sweep countdown ────────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: parked
        cards:
          - type: markdown
            content: |
              {% set street = state_attr('sensor.parked_location', 'street') %}
              {% set side   = state_attr('sensor.parked_location', 'side') %}
              {% set block  = state_attr('sensor.parked_location', 'block_limits') %}
              ## 📍 {{ side }} side of {{ street }}
              {% if block %}<span style="opacity:0.65">{{ block | replace('  -  ', ' – ') }}</span>{% endif %}
          - type: custom:button-card
            template: sweep_card

      # ── PARKED: time limit (only if present) ──────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: parked
          - condition: template
            value_template: >
              {{ states('sensor.parking_time_limit') not in
                 ('unknown', 'unavailable', 'none', '') }}
        cards:
          - type: tile
            entity: sensor.parking_time_limit
            name: Time limit
            icon: mdi:timer-sand

      # ── PARKED: actions ────────────────────────────────────────────────
      - type: grid
        visibility:
          - condition: state
            entity: sensor.car_parker_status
            state: parked
        cards:
          - type: custom:button-card
            template: maps_button
          - type: button
            name: Clear spot
            icon: mdi:car-off
            tap_action:
              action: call-service
              service: car_parker.clear
              confirmation:
                text: Forget this parking spot?

      # ── Manual entry (shown when empty or parked) ──────────────────────
      # Parking happens via the `car_parker_manual_entry` automation
      # (see dashboard/car_parker.automation.yaml), which fires on the
      # COMMITTED input_text value — just type and press Enter.
      #
      # Do NOT drive this with a button that reads the field via
      # `[[[ return entity.state; ]]]`: the button-card tap fires before the
      # input_text value round-trips through HA, so it silently sends an empty
      # string on first use and nothing gets parked.
      - type: grid
        visibility:
          - condition: template
            value_template: >
              {{ states('sensor.car_parker_status') in ('empty', 'parked') }}
        cards:
          - type: markdown
            content: |
              #### Manual entry
              Type your location and press **Enter** —
              _e.g. "Anza between 7th and 8th, north side"_
          - type: entities
            entities:
              - entity: input_text.car_parker_manual_text
                name: Location
