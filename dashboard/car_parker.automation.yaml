# Car Parker — park from the manual-entry text field.
#
# Add to your HA automations (e.g. drop into a file loaded by
# `automation: !include_dir_merge_list automations/`).
#
# It triggers on the COMMITTED input_text value (fires after Enter/blur),
# which is why the dashboard has no "set location" button: a button-card that
# reads the field via `[[[ return entity.state; ]]]` fires before the value
# round-trips through HA and silently sends an empty string on first use.
- id: car_parker_manual_entry
  alias: "Car Parker — park from manual text entry"
  description: Park when a location is typed into the manual-entry field.
  mode: single
  trigger:
    - platform: state
      entity_id: input_text.car_parker_manual_text
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state | trim not in ("", "unknown", "unavailable") }}
  action:
    - service: car_parker.park_manual
      data:
        text: "{{ trigger.to_state.state }}"
    # Clear the field so the next entry re-triggers and the box doesn't
    # linger. Setting it to "" is filtered out by the condition above.
    - service: input_text.set_value
      target:
        entity_id: input_text.car_parker_manual_text
      data:
        value: ""

# Car Parker — auto-park from the car's GPS when you switch the ignition off.
#
# If your car surfaces an ignition/vehicle-state sensor in HA (e.g. the Subaru
# Starlink integration), this captures where you parked at the freshest possible
# moment — the GPS fix updates on ignition-off. It calls car_parker.park_at_car,
# which reads the device_tracker you set in the Car Parker options, so the only
# thing to customize here is the trigger sensor. It starts the "pick block →
# confirm side" flow; GPS alone can't tell which side you're on, so you still
# confirm that on the dashboard.
#
# Replace the trigger entity_id with your car's vehicle-state sensor, and set
# your car's device_tracker under Settings → Devices & Services → Car Parker →
# Configure.
- id: car_parker_park_from_car_gps
  alias: "Car Parker — park from car GPS on ignition-off"
  description: Auto-detect the parked block when the car's ignition turns off.
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.YOUR_CAR_vehicle_state  # ignition/vehicle-state sensor
      to: "ignition_off"
  action:
    # Small settle so the car's position attributes finish updating alongside
    # the ignition state before park_at_car reads them.
    - delay: "00:00:05"
    - service: car_parker.park_at_car
